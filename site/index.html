<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="app">
  <header class="top">
    <span>Vol. 01 — 2026</span>
    <span class="brand">STUDY FILES ®</span>
    <span class="right">Personal research archive</span>
  </header>

  <section class="hero">
    <h1>Archive</h1>
    <p>지속적으로 공부하고, 궁금해 했던 것들을 저장하는 개인 아카이브. 노트, 대화, 스킬, 프로젝트를 폴더별로 보관합니다.</p>
    <span class="hint">폴더 탭을 눌러 파일을 여세요 ↓</span>
  </section>

  <main class="cabinet" id="cabinet" aria-label="폴더 캐비닛"></main>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="dim" data-close></div>
  <div class="sheet-wrap">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="파일"></div>
  </div>
</div>

<script>
  // Display options (were the "Tweaks" in the design prototype).
  window.STUDY_CONFIG = { pageTurn: 'flip' /* 'flip' | 'fade' */, highlight: 'marker' /* 'marker' | 'block' */, showThumbs: true };
</script>
<script src="assets/entries.js"></script>
<script src="assets/dossier.js"></script>
